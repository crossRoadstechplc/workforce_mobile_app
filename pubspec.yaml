name: workforce_employee_app
description: Employee mobile client for the workforce attendance platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.9.0
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  permission_handler: ^12.0.3
  connectivity_plus: ^7.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.6.2
  table_calendar: ^3.2.0
  socket_io_client: ^3.1.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
